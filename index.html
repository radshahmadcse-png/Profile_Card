<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rad Shahmad Profile Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="viewport-wrapper">
      <article class="profile-card">
        <img
          class="avatar"
          src="Rad.jpeg"
          alt="Profile photo of Rad Shahmad"
          height="150"
          width="150"
        />

        <h2 class="user-name">Rad Shahmad</h2>

        <p class="user-bio">Frontend Developer & UI Designer</p>

        <section class="stats-section" aria-label="Social statistics">
          <ul class="stats-list">
            <li class="stat-item">
              <span class="stat-value">98</span>
              <span class="stat-label">Followers</span>
            </li>
            <li class="stat-item">
              <span class="stat-value">86</span>
              <span class="stat-label">Following</span>
            </li>
            <li class="stat-item">
              <span class="stat-value">6</span>
              <span class="stat-label">Posts</span>
            </li>
          </ul>
        </section>

        <button
          class="follow-btn"
          type="button"
          onclick="
            window.location.href =
              'https://www.instagram.com/rad_shahmad?igsh=MjI2ZDd5dWd0OWwz'
          "
        >
          Follow
        </button>
      </article>
    </main>
  </body>
</html>
